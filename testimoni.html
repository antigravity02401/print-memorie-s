<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beri Testimoni — Print Memorie's</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="assets/images/favicon.png" type="image/png" />
  <style>
    .testimoni-page-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: var(--dark-1);
    }
    .testimoni-card {
      background: var(--dark-2);
      border: 1px solid var(--dark-border);
      border-radius: var(--border-radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .testimoni-card h1 {
      color: var(--gold);
      margin-bottom: 10px;
      font-size: 2rem;
    }
    .testimoni-card p {
      color: var(--text-dim);
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-light);
      font-size: 0.9rem;
    }
    .form-control {
      width: 100%;
      padding: 12px 16px;
      background: var(--dark-3);
      border: 1px solid var(--dark-border);
      border-radius: var(--border-radius-sm);
      color: var(--text-light);
      font-family: inherit;
      font-size: 1rem;
      transition: var(--transition-fast);
      box-sizing: border-box;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(201, 168, 76, 0.2);
    }
    textarea.form-control {
      resize: vertical;
      min-height: 100px;
    }
    .rating-select {
      appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg fill="%23c9a84c" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 20px;
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--gold);
      color: var(--dark-1);
      border: none;
      border-radius: var(--border-radius-sm);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
      margin-top: 10px;
    }
    .submit-btn:hover {
      background: var(--gold-light);
    }
    .submit-btn:disabled {
      background: var(--dark-4);
      color: var(--text-dim);
      cursor: not-allowed;
    }
    .form-message {
      margin-top: 20px;
      font-size: 0.9rem;
      display: none;
      padding: 12px;
      border-radius: var(--border-radius-sm);
    }
    .form-message.success {
      display: block;
      background: rgba(46, 213, 115, 0.1);
      color: #2ed573;
      border: 1px solid rgba(46, 213, 115, 0.2);
    }
    .form-message.error {
      display: block;
      background: rgba(255, 71, 87, 0.1);
      color: #ff4757;
      border: 1px solid rgba(255, 71, 87, 0.2);
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.9rem;
      transition: var(--transition-fast);
    }
    .back-link:hover {
      color: var(--gold);
    }
  </style>
</head>
<body>

  <div class="testimoni-page-container">
    <div class="testimoni-card">
      <h1>Berikan Testimoni</h1>
      <p>Bagikan pengalaman Anda menggunakan layanan Print Memorie's</p>

      <form id="testimoniForm">
        <div class="form-group">
          <label for="name">Nama (atau Nama Pasangan)</label>
          <input type="text" id="name" class="form-control" placeholder="Contoh: Rina & Budi" required />
        </div>
        
        <div class="form-group">
          <label for="rating">Penilaian</label>
          <select id="rating" class="form-control rating-select" required>
            <option value="5">⭐⭐⭐⭐⭐ (Sangat Puas)</option>
            <option value="4">⭐⭐⭐⭐ (Puas)</option>
            <option value="3">⭐⭐⭐ (Cukup)</option>
            <option value="2">⭐⭐ (Kurang)</option>
            <option value="1">⭐ (Sangat Kurang)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Pesan & Kesan</label>
          <textarea id="message" class="form-control" placeholder="Tuliskan pengalaman Anda di sini..." required></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Kirim Testimoni</button>
        
        <div id="formMessage" class="form-message"></div>
      </form>

      <a href="index.html" class="back-link">← Kembali ke Beranda</a>
    </div>
  </div>

  <script>
    document.getElementById('testimoniForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('formMessage');
      
      const name = document.getElementById('name').value;
      const rating = document.getElementById('rating').value;
      const message = document.getElementById('message').value;

      btn.disabled = true;
      btn.textContent = 'Mengirim...';
      msg.className = 'form-message';
      msg.textContent = '';

      try {
        const response = await fetch('/api/add-testimonial', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, rating: parseInt(rating), message })
        });

        if (!response.ok) throw new Error('Terjadi kesalahan saat mengirim data.');

        msg.className = 'form-message success';
        msg.textContent = 'Terima kasih! Testimoni Anda berhasil dikirim.';
        document.getElementById('testimoniForm').reset();
      } catch (error) {
        msg.className = 'form-message error';
        msg.textContent = error.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Kirim Testimoni';
      }
    });
  </script>
</body>
</html>
